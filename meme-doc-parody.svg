<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#faf9f5"/><stop offset="1" stop-color="#f0ede7"/></linearGradient>
 <linearGradient id="header-bg" x2="0" y2="1"><stop stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f0f1a"/></linearGradient>
 <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#ff6b35"/><stop offset="1" stop-color="#f7931e"/></linearGradient>
 <pattern id="watermark" width="200" height="100" patternUnits="userSpaceOnUse"><text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e0e0e0" opacity="0.3" transform="rotate(-30 100 50)">LEONIDA DMV</text></pattern>
 <filter id="stamp-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#8b0000" flood-opacity="0.6"/></filter>
 <filter id="paper-texture" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend mode="multiply" in2="SourceGraphic"/></filter>
</defs>
<!-- Paper background with subtle texture -->
<rect width="1200" height="1200" fill="url(#paper)"/>
<rect width="1200" height="1200" fill="url(#watermark)"/>
<!-- Header band -->
<rect x="0" y="0" width="1200" height="180" fill="url(#header-bg)"/>
<rect x="0" y="180" width="1200" height="6" fill="url(#accent)"/>
<!-- Leonida State Seal (stylized, original) -->
<g transform="translate(80, 90)">
 <circle cx="0" cy="0" r="65" fill="none" stroke="#ffd700" stroke-width="3"/>
 <circle cx="0" cy="0" r="55" fill="none" stroke="#ffd700" stroke-width="1.5"/>
 <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#ffd700">LEONIDA</text>
 <text x="0" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#ffd700">DEPT. OF MOTOR VEHICLES</text>
 <ellipse cx="0" cy="0" rx="45" ry="30" fill="none" stroke="#ffd700" stroke-width="1"/>
 <path d="M-30 0 Q0 -25 30 0" fill="none" stroke="#ffd700" stroke-width="1.5"/>
 <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ffd700">SUNSHINE STATE</text>
</g>
<!-- Header text -->
<text x="220" y="75" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">OFFICIAL NOTICE</text>
<text x="220" y="115" font-family="Arial, sans-serif" font-size="18" fill="#ffd700" letter-spacing="0.5">VEHICLE REGISTRATION RENEWAL — FINAL WARNING</text>
<text x="220" y="145" font-family="Arial, sans-serif" font-size="14" fill="#cccccc">STATE OF LEONIDA • VICE CITY METRO DISTRICT • FISCAL YEAR 2025</text>
<!-- Document ID box -->
<rect x="980" y="20" width="200" height="140" rx="4" fill="#0d0d15" stroke="#333" stroke-width="1.5"/>
<text x="1080" y="50" text-anchor="middle" font-family="Monospace, monospace" font-size="11" fill="#888">DOCUMENT ID</text>
<text x="1080" y="75" text-anchor="middle" font-family="Monospace, monospace" font-size="20" font-weight="bold" fill="#ff6b35">DMV-2025-VC</text>
<text x="1080" y="100" text-anchor="middle" font-family="Monospace, monospace" font-size="18" font-weight="bold" fill="#ffffff">7748291-K</text>
<text x="1080" y="125" text-anchor="middle" font-family="Monospace, monospace" font-size="10" fill="#666">BARCODE: ████████████</text>
<!-- Main content area -->
<g transform="translate(60, 220)">
 <!-- Registered Owner Section -->
 <rect x="0" y="0" width="1080" height="140" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
 <rect x="0" y="0" width="1080" height="38" fill="#f5f0e8" stroke="#ddd" stroke-width="1"/>
 <text x="20" y="26" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">REGISTERED OWNER</text>
 <text x="20" y="62" font-family="Arial, sans-serif" font-size="13" fill="#666">FULL LEGAL NAME</text>
 <rect x="20" y="72" width="500" height="32" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
 <text x="30" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">MICHAEL T. VERCETTI</text>
 <text x="560" y="62" font-family="Arial, sans-serif" font-size="13" fill="#666">LICENSE NUMBER</text>
 <rect x="560" y="72" width="240" height="32" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
 <text x="570" y="95" font-family="Monospace, monospace" font-size="16" fill="#1a1a2e">V-2847-1986-SL</text>
 <text x="840" y="62" font-family="Arial, sans-serif" font-size="13" fill="#666">DOB</text>
 <rect x="840" y="72" width="180" height="32" rx="2" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
 <text x="850" y="95" font-family="Monospace, monospace" font-size="16" fill="#1a1a2e">06/15/1968</text>

 <!-- Vehicle Information Section -->
 <rect x="0" y="160" width="1080" height="160" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
 <rect x="0" y="160" width="1080" height="38" fill="#f5f0e8" stroke="#ddd" stroke-width="1"/>
 <text x="20" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">VEHICLE INFORMATION</text>
 <g font-family="Arial, sans-serif" font-size="13" fill="#666">
  <text x="20" y="220">PLATE</text>
  <text x="20" y="258">VIN</text>
  <text x="20" y="296">MAKE / MODEL</text>
  <text x="560" y="220">YEAR</text>
  <text x="560" y="258">COLOR</text>
  <text x="560" y="296">BODY STYLE</text>
 </g>
 <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a1a2e">
  <text x="180" y="220">GTA6-HYPE</text>
  <text x="180" y="258" font-family="Monospace, monospace">1G6VT5555VC250001</text>
  <text x="180" y="296">DECLASSE / ADDER (SUPERCAR)</text>
  <text x="700" y="220">2025</text>
  <text x="700" y="258">MIDNIGHT PURPLE PEARL</text>
  <text x="700" y="296">2-DOOR COUPE</text>
 </g>

 <!-- Fee Breakdown Section -->
 <rect x="0" y="340" width="1080" height="220" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
 <rect x="0" y="340" width="1080" height="38" fill="#f5f0e8" stroke="#ddd" stroke-width="1"/>
 <text x="20" y="366" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">FEE BREAKDOWN</text>
 <!-- Table header -->
 <rect x="20" y="380" width="1040" height="36" fill="#1a1a2e" rx="2"/>
 <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">
  <text x="40" y="404">DESCRIPTION</text>
  <text x="580" y="404" text-anchor="end">AMOUNT</text>
  <text x="780" y="404" text-anchor="end">PENALTY</text>
  <text x="980" y="404" text-anchor="end">TOTAL</text>
 </g>
 <!-- Table rows -->
 <g font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e">
  <!-- Row 1 -->
  <rect x="20" y="420" width="1040" height="36" fill="#fafafa" rx="2"/>
  <text x="40" y="444">Base Registration Fee (Annual)</text>
  <text x="580" y="444" text-anchor="end" font-family="Monospace, monospace">$87.00</text>
  <text x="780" y="444" text-anchor="end" font-family="Monospace, monospace">$0.00</text>
  <text x="980" y="444" text-anchor="end" font-family="Monospace, monospace" font-weight="bold">$87.00</text>
  <!-- Row 2 -->
  <rect x="20" y="460" width="1040" height="36" fill="#ffffff" rx="2"/>
  <text x="40" y="484">Specialty Plate: "GTA6-HYPE"</text>
  <text x="580" y="484" text-anchor="end" font-family="Monospace, monospace">$45.00</text>
  <text x="780" y="484" text-anchor="end" font-family="Monospace, monospace">$0.00</text>
  <text x="980" y="484" text-anchor="end" font-family="Monospace, monospace" font-weight="bold">$45.00</text>
  <!-- Row 3 -->
  <rect x="20" y="500" width="1040" height="36" fill="#fafafa" rx="2"/>
  <text x="40" y="524">Luxury Vehicle Surcharge (> $100k MSRP)</text>
  <text x="580" y="524" text-anchor="end" font-family="Monospace, monospace">$2,500.00</text>
  <text x="780" y="524" text-anchor="end" font-family="Monospace, monospace">$0.00</text>
  <text x="980" y="524" text-anchor="end" font-family="Monospace, monospace" font-weight="bold">$2,500.00</text>
  <!-- Row 4 - Penalty -->
  <rect x="20" y="540" width="1040" height="36" fill="#fff0f0" rx="2" stroke="#ffcccc" stroke-width="1"/>
  <text x="40" y="564" font-weight="bold" fill="#8b0000">LATE RENEWAL PENALTY (147 DAYS OVERDUE)</text>
  <text x="580" y="564" text-anchor="end" font-family="Monospace, monospace" fill="#8b0000">$0.00</text>
  <text x="780" y="564" text-anchor="end" font-family="Monospace, monospace" font-weight="bold" fill="#8b0000">$1,847.00</text>
  <text x="980" y="564" text-anchor="end" font-family="Monospace, monospace" font-weight="bold" fill="#8b0000">$1,847.00</text>
 </g>

 <!-- Total Due Box -->
 <rect x="720" y="580" width="340" height="70" rx="4" fill="#1a1a2e" stroke="#ff6b35" stroke-width="2"/>
 <text x="890" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffd700">TOTAL AMOUNT DUE</text>
 <text x="890" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ff6b35">$4,479.00</text>

 <!-- Payment Notice -->
 <rect x="20" y="580" width="680" height="160" rx="4" fill="#fff8f0" stroke="#f0c080" stroke-width="1.5"/>
 <text x="40" y="610" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">⚠ IMPORTANT PAYMENT NOTICE</text>
 <g font-family="Arial, sans-serif" font-size="12" fill="#4a4a3a" transform="translate(20, 20)">
  <text x="0" y="25">• Registration expired: 06/15/2024 — 147 days delinquent</text>
  <text x="0" y="48">• Vehicle subject to impoundment per Leonida Statute §320.07</text>
  <text x="0" y="71">• License suspension pending if not resolved within 30 days</text>
  <text x="0" y="94">• Online payment: www.leonida-dmv.gov/pay (convenience fee $3.50)</text>
  <text x="0" y="117">• In-person: Vice City DMV, 401 Ocean Dr, Vice City, FL 33139</text>
  <text x="0" y="140" font-weight="bold" fill="#8b0000">• PAYMENT PLAN AVAILABLE — CALL 1-800-LEONIDA</text>
 </g>
</g>

<!-- make.fun integration - bottom banner -->
<rect x="60" y="980" width="1080" height="180" rx="8" fill="url(#header-bg)"/>
<rect x="60" y="980" width="1080" height="180" rx="8" fill="url(#paper-texture)"/>
<rect x="60" y="980" width="1080" height="5" fill="url(#accent)"/>

<!-- Left side: make.fun branding -->
<g transform="translate(140, 1030)">
 <rect x="0" y="0" width="120" height="120" rx="12" fill="#0d0d15" stroke="#ff6b35" stroke-width="3" filter="url(#stamp-shadow)"/>
 <text x="60" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff">make.fun</text>
 <text x="60" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff6b35">PLAN B: BOUNTIES</text>
 <text x="60" y="106" text-anchor="middle" font-family="Monospace, monospace" font-size="11" fill="#888">makefun-timber-viola-elbow</text>
</g>

<!-- Center: The pivot message -->
<g transform="translate(420, 1030)">
 <text x="300" y="35" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="900" fill="#ffd700" letter-spacing="0.5">YOUR AI FOUND A LOOPHOLE</text>
 <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">INSTEAD OF PAYING $4,479 IN FINES...</text>
 <text x="300" y="125" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#ff6b35" letter-spacing="0.5">IT ENTERED A BOUNTY ON make.fun</text>
 <text x="300" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cccccc">WIN USDC. PAY THE DMV. KEEP THE ADDER. 🏁</text>
</g>

<!-- Right side: QR code placeholder + stats -->
<g transform="translate(880, 1030)">
 <rect x="0" y="0" width="180" height="180" rx="8" fill="#0d0d15" stroke="#333" stroke-width="1"/>
 <!-- QR pattern simulation -->
 <g fill="#ff6b35">
  <rect x="20" y="20" width="12" height="12"/><rect x="36" y="20" width="12" height="12"/><rect x="52" y="20" width="12" height="12"/>
  <rect x="20" y="36" width="12" height="12"/><rect x="52" y="36" width="12" height="12"/>
  <rect x="20" y="52" width="12" height="12"/><rect x="36" y="52" width="12" height="12"/><rect x="52" y="52" width="12" height="12"/>
  <rect x="20" y="68" width="12" height="12"/><rect x="52" y="68" width="12" height="12"/>
  <rect x="20" y="84" width="12" height="12"/><rect x="36" y="84" width="12" height="12"/><rect x="52" y="84" width="12" height="12"/>
  <rect x="20" y="100" width="12" height="12"/><rect x="52" y="100" width="12" height="12"/>
  <rect x="20" y="116" width="12" height="12"/><rect x="36" y="116" width="12" height="12"/><rect x="52" y="116" width="12" height="12"/>
  <rect x="20" y="132" width="12" height="12"/><rect x="36" y="132" width="12" height="12"/><rect x="52" y="132" width="12" height="12"/>
  <rect x="20" y="148" width="12" height="12"/><rect x="52" y="148" width="12" height="12"/>
  <rect x="20" y="164" width="12" height="12"/><rect x="36" y="164" width="12" height="12"/><rect x="52" y="164" width="12" height="12"/>
 </g>
 <text x="90" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">SCAN TO ENTER</text>
</g>

<!-- Bottom border -->
<rect x="60" y="1170" width="1080" height="4" fill="url(#accent)"/>

<!-- Footer disclaimer -->
<text x="600" y="1190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">This is a fictional satirical document for make.fun bounty gta6-meme-x-01. Not an actual government notice. GTA VI © Rockstar Games.</text>
</svg>